// Protocol reference: docs/stats-exporter.md
// Wire schema for the live stats named pipe (\\.\pipe\generalsonline-stats-<pid>).
// Bodies are framed as: u32 little-endian body length + u8 type.
//   outbound (game -> reader), while a reader is connected:
//     0x01 MatchInfo      match loading/start/end and the players; on connect: LOADING only while the match is loading, else STARTED
//     0x02 StatsSnapshot  periodic live stats: light ones every 100 ms of game time, full ones every 250 ms; waits for STARTED
//     0x07 Events         the discrete events of one logic frame, sent at the end of that frame; waits for STARTED
//     0x08 Camera         the local tactical camera and the minimap view box, sent from the render loop whenever it changed; waits for STARTED
//     0x03 MatchSummary   end-of-match scores
//     0x04 ChatMessage    a chat line as shown to the local player (in-match, game lobby or room)
//     0x05 UiState        the screen the game is on; the first frame sent to a new reader
//     0x06 LobbyState     the game setup lobby the local user sits in; sent on change, and with in_lobby = false on leaving
//   inbound (reader -> game):
//     0x10 ChatSend       send a chat line through the game's own typed-line path, commands included
// Naming: player_index is the engine Player::getPlayerIndex(), lobby_slot is the 0-based lobby slot.
syntax = "proto3";

package statsexporter;

// Lite runtime: no descriptors or reflection, and it links against the libprotobuf the networking stack already uses.
option optimize_for = LITE_RUNTIME;

// One live template's current (not cumulative) count.
message TemplateCount
{
	string template_name = 1;
	uint32 count = 2;
}

// One special power's cooldown state; not deduped by power name.
message ReadinessSample
{
	string power_name = 1;
	uint32 ready_frame = 2;	// absolute logic frame at which the power is ready (not a duration)
	float percent_ready = 3;	// 1.0 = ready now
}

enum StatEventKind
{
	STATEVENT_ABILITY_USE = 0;		// player = the user; primary_name = the special power; secondary_name = the source unit template, or the target template for building captures (variant then "source=<unit template>")
	STATEVENT_SCIENCE_PURCHASE = 1;	// primary_name = the science; int_value1 = the player's rank level, int_value2 = the science purchase points left
	STATEVENT_KILL = 2;				// player = the killer; the victim's template and category; cost = its build cost
	STATEVENT_LOSS = 3;				// player = the owner of the lost object; template, category and cost of what was lost
	STATEVENT_BUILD = 4;			// player = the owner; the new object's template and category; int_value1 = the veterancy level it starts with (0 regular .. 3 heroic)
	STATEVENT_EVACUATE = 5;			// player = the owner; primary_name = the transport or garrison template; variant "count=<n>"
	STATEVENT_VETERANCY_CHANGE = 6;	// a promotion earned from experience (never a level given at creation); int_value1 = old level, int_value2 = new level
	STATEVENT_SALVAGE_UPGRADE = 7;	// category WEAPON or ARMOR; primary_name = the unit template; int_value1 = the new tier
	STATEVENT_BEACON = 8;			// location set; category is the player's beacon
	STATEVENT_PLAYER_LEFT = 9;		// once per player and match, the first cause wins; variant: "left" (quit or disconnect, from the network leave command) or "self_destruct" (surrender)
	STATEVENT_PLAYER_DEFEATED = 10;	// the engine marked the player defeated
	STATEVENT_SELL = 11;			// a structure finished selling; primary_name is its template, cost the refund
	STATEVENT_RADAR_CHANGED = 12;	// int_value1 = old RadarState, int_value2 = new RadarState
	STATEVENT_BATTLE_PLAN_CHANGED = 13;	// int_value1 = old BattlePlan, int_value2 = new BattlePlan (the plan affecting the player's troops)
	STATEVENT_UPGRADE_COMPLETE = 14;	// primary_name = upgrade internal name, cost = its build cost; variant "object" for a per-object upgrade
	STATEVENT_CAPTURE = 15;		// a structure changed owner by capture: player = new owner, int_value1 = old owner player index, variant "tech" for a tech building, cost = the one-time cash bonus the capture paid (0 if none)
	STATEVENT_POWER_SABOTAGED = 16;	// player = the victim, int_value1 = how many logic frames the sabotage lasts
}

// A discrete gameplay-outcome event; frame is the logic frame it happened in. player_index is the acting player (the killer, the owner, the new
// owner for captures; see StatEventKind). category is a coarse bucket: SUPERWEAPON/STRUCTURE/INFANTRY/VEHICLE/OTHER from the template
// (kill, loss, build, sell, capture, evacuate, veterancy), ABILITY or SUPERWEAPON for abilities, SCIENCE, WEAPON/ARMOR for salvage upgrades,
// UPGRADE, BEACON, and PLAYER for the player-state kinds (left, defeated, radar, battle plan, power sabotage).
message StatEvent
{
	uint32 frame = 1;
	int32 player_index = 2;
	StatEventKind kind = 3;
	string category = 4;
	string primary_name = 5;	// template/power/science name
	string secondary_name = 6;	// ability source/target template, when known
	bool has_location = 7;
	float x = 8;
	float y = 9;
	string variant = 10;		// free-form extra context (e.g. evacuate count)
	int32 int_value1 = 11;		// e.g. veterancy oldLevel, salvage tier
	int32 int_value2 = 12;		// e.g. veterancy newLevel
	uint32 cost = 13;			// kill and loss events: the victim template's build cost
}

// The discrete events produced during one logic frame, sent at the end of that frame (never with a snapshot), so frame equals every
// StatEvent.frame in it. Events are dropped only when 512 are already pending, or the outbound queue is full.
message Events
{
	uint32 frame = 1;
	repeated StatEvent events = 2;
}

// One periodic sample, one entry per non-observer player of the match (defeated and departed ones stay, see PlayerStats.state;
// campaign and solo games have no per-player entries). frame is the logic frame about to be simulated: the sample is taken at the start
// of that frame, so it shows the state at the end of frame - 1, and the Events up to frame - 1 have already been sent.
// A light snapshot (full = false) carries only the cheap per-player
// numbers; a full one also carries everything that needs a walk over the live objects. Readers keep the last full
// values of the heavy fields and overwrite the light ones: heavy = army_value, live_superweapon_structure_count,
// live_template_counts, readiness, sciences, upgrades, production, workers, harvesters, idle_workers, heroes,
// superweapons, army_value_by_class, army_count_by_class, tech_structures, battle_plan_transition (per player) and
// grids, supply, tech, connections (per snapshot).
// Stall marker: while the logic waits on a peer a snapshot with no players and full = false is sent about every 250 ms of wall-clock time.
// It carries frame, network_stalled, stalled_frames, game_speed_fps / game_speed_ratio and local_render_fps (all current values);
// local_logic_fps is 0 and everything else is absent. No snapshots or Events are produced while the logic is stalled or paused.
message StatsSnapshot
{
	uint32 frame = 1;
	repeated PlayerStats players = 2;
	repeated OnlineConnection connections = 4;	// the local client's own peer connections
	repeated PlayerGrid grids = 5;	// one per exported player
	repeated SupplySource supply = 6;	// supply sources on the map, capped, non-empty first
	uint32 replay_total_frames = 7;	// frames in the replay being played back, 0 otherwise
	int32 game_speed_fps = 8;	// FramePacer's actual logic time scale in frames per second (equals logic_frames_per_second at normal speed); 0 = frozen or halted, -1 = uncapped
	float game_speed_ratio = 9;	// the same as a ratio of normal speed
	repeated TechStructure tech = 10;	// neutral and captured tech structures on the map, capped
	repeated uint32 selected_object_ids = 12;	// this client's current selection, capped; client-side like the camera
	bool network_stalled = 13;	// the logic is waiting on a peer (Network::isStalling)
	uint32 stalled_frames = 14;	// how long, in logic frames at the nominal rate, derived from wall-clock time
	// Local client only, differs per client: how fast THIS machine is running.
	float local_render_fps = 15;	// the display's average rendered frames per second (Display::getAverageFPS), 0 when unknown
	float local_logic_fps = 16;	// logic frames per wall-clock second measured between this and the previous snapshot, 0 on the first
	bool full = 17;			// true: carries the heavy fields too; false: light snapshot, heavy fields absent (keep the last full values)
}

message TechStructure
{
	uint32 object_id = 1;
	string template_name = 2;
	float x = 3;
	float y = 4;
	int32 owner_player_index = 5;	// -1 when neutral
}

// The local tactical view. Per client: not part of the synchronized game state. Sent from the render loop (once per
// rendered frame at most, 120 per second at most, only when something changed), so it is as current as the picture.
message Camera
{
	uint64 timestamp_us = 1;	// QueryPerformanceCounter in microseconds: monotonic, only differences are meaningful
	uint32 logic_frame = 2;
	float x = 3;				// world position the camera looks at
	float y = 4;
	float zoom = 5;				// the view's zoom factor (1.0 = default)
	float angle = 6;			// radians
	float pitch = 7;			// radians
	float height_above_ground = 8;	// world units
	// The minimap view box: the world-space ground points where the four screen corners land, at the map's average
	// terrain height, in the order the game's own minimap box uses: top left, top right, bottom right, bottom left.
	bool has_view_box = 9;
	float view_tl_x = 10;
	float view_tl_y = 11;
	float view_tr_x = 12;
	float view_tr_y = 13;
	float view_br_x = 14;
	float view_br_y = 15;
	float view_bl_x = 16;
	float view_bl_y = 17;
}

// Unit and structure counts per cell over the map's playable extent (MatchInfo world_*), row-major from the min corner.
// Counts objects with KINDOF_STRUCTURE, INFANTRY, VEHICLE or AIRCRAFT that are not dead; projectiles, effects and inert objects are not counted.
message PlayerGrid
{
	int32 player_index = 1;
	uint32 width = 2;			// always 32
	uint32 height = 3;			// always 32
	float cell_width = 4;		// world units
	float cell_height = 5;
	repeated uint32 cells = 6;	// width * height counts, zeros included
}

// A supply source (warehouse) on the map.
message SupplySource
{
	uint32 object_id = 1;
	string template_name = 2;
	float x = 3;
	float y = 4;
	uint32 remaining_value = 5;	// cash: boxes stored times ValuePerSupplyBox
	uint32 remaining_boxes = 6;
}

// Whether a player's radar works. NONE: no radar structure or ability. UNPOWERED: radar producers exist but the player's
// radar is switched off (brown-out: Player::onPowerBrownOutChange, which a power plant sabotage also causes).
// ACTIVE: Player::hasRadar(). Derived from the engine's own radar counters.
enum RadarState
{
	RADAR_NONE = 0;
	RADAR_UNPOWERED = 1;
	RADAR_ACTIVE = 2;
}

enum BattlePlan
{
	BATTLE_PLAN_NONE = 0;
	BATTLE_PLAN_BOMBARDMENT = 1;
	BATTLE_PLAN_HOLD_THE_LINE = 2;
	BATTLE_PLAN_SEARCH_AND_DESTROY = 3;
}

// What the player's Strategy Centers are doing. DEPLOYING: at least one is unpacking; PACKING: at least one is packing
// (DEPLOYING wins if both); ACTIVE: a plan is deployed; IDLE: none.
enum BattlePlanTransition
{
	BATTLE_PLAN_IDLE = 0;
	BATTLE_PLAN_DEPLOYING = 1;
	BATTLE_PLAN_ACTIVE = 2;
	BATTLE_PLAN_PACKING = 3;
}

// Network numbers for one human player. Every field is -1 when this client does not know it.
message NetworkStats
{
	bool is_local = 1;			// this player is the local client
	int32 reported_fps = 2;		// the player's own average DISPLAY frames per second (ConnectionManager run-ahead metrics), -1 if unknown
	int32 latency_ms = 3;		// the player's own average frame round-trip latency in milliseconds (FrameMetrics, converted from seconds), -1 if unknown
	int32 ping_ms = 4;			// Generals Online mesh round-trip time between the local client and this player in milliseconds, -1 for the local player or no connection
	bool relayed = 5;			// the mesh connection to this player goes through a relay (only meaningful when ping_ms >= 0)
}

message PlayerStats
{
	int32 player_index = 1;
	uint32 money = 2;
	int32 energy_production = 3;
	int32 energy_consumption = 4;
	uint32 total_money_earned = 5;
	uint32 units_built = 6;
	uint32 units_lost = 7;
	uint32 units_destroyed = 8;
	uint32 buildings_built = 9;
	uint32 buildings_lost = 10;
	uint32 buildings_destroyed = 11;
	int32 score = 12;
	int32 army_value = 13;		// sum of build costs over the live objects: not effectively dead; a structure under construction counts
	uint32 live_superweapon_structure_count = 14;	// live superweapon structures, under construction included
	repeated TemplateCount live_template_counts = 15;
	repeated ReadinessSample readiness = 16;	// powers the player can fire, from live structures that are complete
	int32 rank_level = 17;
	int32 skill_points = 18;	// unspent science purchase points
	repeated string sciences = 19;	// purchased sciences, internal names, sent in full every sample
	uint32 money_per_minute = 20;	// Money::getCashPerMinute(): income deposited over the last 60 logic seconds
	uint32 actions_total = 21;	// commands executed for this player since the match started
	uint32 apm_current = 22;	// actions per minute over the last 60 logic seconds (extrapolated during the first minute)
	uint32 value_destroyed = 23;	// cumulative build cost of enemy objects this player destroyed
	uint32 value_lost = 24;		// cumulative build cost of this player's objects lost
	repeated ProductionQueue production = 25;	// structures with something in production; capped per player
	uint32 workers = 26;		// live objects with KINDOF_DOZER
	uint32 harvesters = 27;		// live objects with KINDOF_HARVESTER (a worker can be both)
	uint32 idle_workers = 28;	// KINDOF_DOZER objects whose AI is idle: the test Player uses for the idle worker button
	CategoryCounts kills = 29;	// by victim: aircraft first, else structure, infantry, vehicle
	CategoryCounts losses = 30;
	repeated HeroStatus heroes = 31;	// KINDOF_HERO templates seen alive this match; dead ones stay listed
	repeated SuperweaponTimer superweapons = 32;	// one per superweapon structure
	// Cumulative spend, counted where the engine's ScoreKeeper counts money spent: when production completes.
	// A cancelled production is refunded before it is ever counted, so there is no refund field.
	uint32 spent_units = 33;
	uint32 spent_structures = 34;
	uint32 spent_upgrades = 35;
	uint32 spent_sciences = 36;	// general points spent on sciences, not cash
	// Completed player-level upgrades; per-object upgrades are not exported. Sent in full every sample.
	repeated string upgrades = 37;
	CategoryValue army_value_by_class = 38;	// build cost of live objects by the same classification as kills
	CategoryCounts army_count_by_class = 39;
	repeated string tech_structures = 40;	// template names of tech structures this player owns (KINDOF_TECH_BUILDING, KINDOF_TECH_BASE_DEFENSE)
	RadarState radar = 41;
	BattlePlan battle_plan = 42;				// the plan affecting this player's troops (Player battle plan counters); first non-zero of bombardment, hold the line, search and destroy
	BattlePlanTransition battle_plan_transition = 43;	// state of this player's Strategy Centers
	bool power_sabotaged = 44;				// the player's power is currently sabotaged (Energy sabotaged-until frame is in the future)
	uint32 power_sabotage_frames_left = 45;	// logic frames until the sabotage ends
	NetworkStats network = 46;				// set only for human players of a network match
	PlayerState state = 47;					// active, defeated or departed; the numbers of a non-active player stay and stop changing
}

// Why a player is listed in StatsSnapshot.players. Observers are never listed.
enum PlayerState
{
	PLAYER_STATE_ACTIVE = 0;
	PLAYER_STATE_DEFEATED = 1;	// the engine's defeat state: killed, or nothing left that counts for victory
	PLAYER_STATE_LEFT = 2;		// quit, disconnected or surrendered (a PLAYER_LEFT event was emitted)
}

message CategoryValue
{
	uint32 infantry = 1;
	uint32 vehicle = 2;
	uint32 aircraft = 3;
	uint32 structure = 4;
}

message CategoryCounts
{
	uint32 infantry = 1;
	uint32 vehicle = 2;
	uint32 aircraft = 3;
	uint32 structure = 4;
}

message HeroStatus
{
	string template_name = 1;
	bool alive = 2;
	uint32 object_id = 3;		// 0 when dead
}

enum SuperweaponState
{
	SUPERWEAPON_CHARGING = 0;
	SUPERWEAPON_READY = 1;
}

message SuperweaponTimer
{
	uint32 object_id = 1;
	string template_name = 2;
	string power_name = 3;
	uint32 ready_frame = 4;		// absolute logic frame at which it is ready
	float percent_ready = 5;	// 0-1 (not 0-100), 1.0 = ready
	SuperweaponState state = 6;
}

enum ProductionKind
{
	PRODUCTION_KIND_UNIT = 0;
	PRODUCTION_KIND_UPGRADE = 1;
}

// One entry of a structure's production queue.
message ProductionItem
{
	ProductionKind kind = 1;
	string name = 2;			// unit template or upgrade name
	float percent_complete = 3;	// 0-100 (not 0-1), the front entry only; 0 for the others
	uint32 quantity = 4;		// units still to come out of this entry
}

// What one structure is producing, front of the queue first.
message ProductionQueue
{
	uint32 object_id = 1;
	string structure_template = 2;
	repeated ProductionItem entries = 3;
}

// Sent once from the score screen, after the ENDED MatchInfo and before the game data is cleared, only to a connected reader.
message MatchSummary
{
	uint32 frame = 1;
	string map_name = 2;
	repeated MatchSummaryPlayer players = 3;
}

message MatchSummaryPlayer
{
	uint32 lobby_slot = 1;
	int32 player_index = 2;
	string player_name = 3;
	string side = 4;
	int32 score = 5;
	bool is_winner = 6;		// the player is in the victorious alliance of a decisive result (as this client sees it); false for everyone when there is none, and for observers
	bool is_observer = 7;
	uint32 units_built = 8;
	uint32 units_lost = 9;
	uint32 units_destroyed = 10;
	uint32 buildings_built = 11;
	uint32 buildings_lost = 12;
	uint32 buildings_destroyed = 13;
	uint32 total_money_earned = 14;
}

enum MatchPhase
{
	MATCH_PHASE_LOADING = 0;	// the loading screen: sides, colors and start positions are resolved, the map is not loaded yet
	MATCH_PHASE_STARTED = 1;
	MATCH_PHASE_ENDED = 2;
}

enum MatchMode
{
	MATCH_MODE_UNKNOWN = 0;
	MATCH_MODE_SINGLE_PLAYER = 1;
	MATCH_MODE_SKIRMISH = 2;
	MATCH_MODE_LAN = 3;
	MATCH_MODE_ONLINE = 4;
	MATCH_MODE_REPLAY = 5;		// offline .rep file played back locally
}

// A slot's outcome as of the ENDED frame; UNKNOWN (OBSERVER for observers) on LOADING and STARTED. On ENDED a decisive result (MatchInfo.completed)
// gives the victorious alliance WON (defeated allies included, as the game counts them) and everyone else LOST; without one a player who left is
// LEFT, a defeated player LOST and the rest UNKNOWN.
enum PlayerResult
{
	PLAYER_RESULT_UNKNOWN = 0;
	PLAYER_RESULT_WON = 1;
	PLAYER_RESULT_LOST = 2;
	PLAYER_RESULT_LEFT = 3;
	PLAYER_RESULT_OBSERVER = 4;
}

// One lobby slot's static data: everything that does not change during the match.
message MatchPlayer
{
	uint32 lobby_slot = 1;
	int32 player_index = 2;
	string name = 3;
	string side = 4;			// raw faction name
	uint32 color = 5;			// packed 0xAARRGGBB; 0 when the colour is still Random (in a lobby)
	int32 team = 6;				// lobby alliance team; -1 when unknown
	bool is_human = 7;
	bool is_observer = 8;
	bool is_color_random = 9;	// left on Random in the lobby
	bool is_side_random = 10;
	PlayerResult result = 11;
	OnlinePlayer online = 12;	// online matches only
	Endpoint lan_address = 13;	// LAN matches only: the lobby slot address
	int32 start_position = 14;	// start position index as the map defines it, -1 when none; resolved from LOADING on
	bool has_start_location = 15;	// not set at LOADING, the map is not loaded yet
	float start_x = 16;			// world position of the start waypoint
	float start_y = 17;
}

// Where the observer camera starts: the start position of the local observer slot, which is a spot a player holds.
message ObserverCamera
{
	int32 start_position = 1;
	int32 lobby_slot = 2;		// the player holding that start position, -1 when none
	int32 player_index = 3;		// the same player's Player::getPlayerIndex(), -1 until the match has started
}

// Announces that a real (non-shell) match started or ended. Sent per phase while a reader is connected;
// a reader connecting mid-match gets a STARTED for the running match before its first StatsSnapshot.
message MatchInfo
{
	MatchPhase phase = 1;
	string match_id = 2;		// opaque; stable across STARTED and ENDED
	MatchMode mode = 3;
	string map_name = 4;		// relative to the game or user data folder, e.g. "maps\alpine assault\alpine assault.map"; UTF-8, never an absolute path
	uint64 start_unix_time = 5;	// seconds since the Unix epoch, taken when the match entered LOADING (kept for STARTED and ENDED)
	uint32 duration_frames = 6;	// logic frames from the start to ENDED; 0 on LOADING and STARTED
	repeated MatchPlayer players = 7;
	string replay_path = 8;		// absolute (it contains the Windows user name), UTF-8, closed and flushed on ENDED; empty when no replay exists
	bool replay_is_playback = 9;	// true when replay_path is an existing file being watched
	bool completed = 10;		// a decisive result was reached (this client's victory conditions); always false on STARTED
	int32 local_player_index = 11;	// the player at this PC, -1 when none
	OnlineMatch online = 12;		// online matches only
	ObserverCamera observer_camera = 13;	// set only when the local player is an observer or this is a replay
	// LOADING only: the lobby prediction the user saw against the engine's resolved values.
	bool has_prediction_check = 14;	// only true if this reader saw the lobby (the prediction is made from LobbyState)
	bool prediction_matched = 15;	// every predicted side, color, start position and the observer camera were right
	bool random_state_clean = 16;	// the logic generator was untouched between the lobby seed and the resolution
	// The playable map extent, for mapping PlayerGrid cells to minimap pixels. Unset at LOADING: the map is not loaded yet.
	bool has_world_extent = 17;
	float world_min_x = 18;
	float world_min_y = 19;
	float world_max_x = 20;
	float world_max_y = 21;
	bool map_is_user_map = 22;	// the map comes from the user data folder, not the game install
	uint32 logic_frames_per_second = 23;	// the build's logic rate (30, or 60 for the high-fps server build); frame / this = game seconds
}

// A network endpoint the client already holds. Never a relay address presented as the peer's.
message Endpoint
{
	string ip = 1;				// textual IPv4/IPv6
	uint32 port = 2;			// 0 when unknown
	bool relayed = 3;			// the connection goes through a relay, ip is unset
}

enum OnlineLobbyType
{
	ONLINE_LOBBY_UNKNOWN = 0;
	ONLINE_LOBBY_CUSTOM = 1;
	ONLINE_LOBBY_QUICKMATCH = 2;
}

// Generals Online lobby data the client holds for the current match.
message OnlineMatch
{
	uint64 match_id = 1;		// the Generals Online match id; 0 until the lobby holds it, then sent in a later STARTED resend
	int64 lobby_id = 2;
	string lobby_name = 3;
	OnlineLobbyType lobby_type = 4;
	bool map_official = 5;
	uint32 starting_cash = 6;
	bool limit_superweapons = 7;
	bool track_stats = 8;
	bool allow_observers = 9;
	bool vanilla_teams = 10;
	uint32 max_players = 11;
	uint32 max_camera_height = 12;
	string region = 13;
}

// A lobby member, joined to MatchPlayer. The ratings are the cached values the lobby tooltip shows; unset if not cached.
message OnlinePlayer
{
	int64 user_id = 1;
	string display_name = 2;
	bool has_stats = 3;
	int32 elo_rating = 4;
	int32 monthly_elo_rating = 5;
	int32 elo_num_matches = 6;
	uint32 total_wins = 7;
	uint32 total_losses = 8;
	uint32 total_disconnects = 9;
}

// One of the local client's peer connections.
message OnlineConnection
{
	int64 user_id = 1;
	int32 latency_ms = 2;
	bool relayed = 3;
	Endpoint endpoint = 4;		// relayed: set with relayed = true and no ip; direct: the peer address; unset when the address is not known
}

enum ChatChannel
{
	CHAT_CHANNEL_MATCH = 0;		// in-match chat
	CHAT_CHANNEL_GAME_LOBBY = 1;	// the game setup lobby before a match
	CHAT_CHANNEL_ROOM = 2;		// the chat room / lobby browser
	CHAT_CHANNEL_LAN_LOBBY = 3;	// the LAN lobby
	CHAT_CHANNEL_LAN_GAME = 4;	// the LAN game setup screen
}

enum ChatAudience
{
	CHAT_AUDIENCE_EVERYONE = 0;
	CHAT_AUDIENCE_ALLIES = 1;
	CHAT_AUDIENCE_OBSERVERS = 2;
	CHAT_AUDIENCE_OTHER = 3;
}

// A chat line as shown to the local player. For lobby and room chat, text is the line as the server formatted it.
message ChatMessage
{
	ChatChannel channel = 1;
	uint32 logic_frame = 2;		// in-match only, 0 otherwise
	int32 player_index = 3;		// in-match sender, -1 when unknown
	int64 user_id = 4;			// lobby sender, 0 when unknown
	string sender_name = 5;
	string text = 6;			// UTF-8
	ChatAudience audience = 7;	// in-match only
	bool is_local = 8;			// sent by the local player
	bool is_system = 9;			// announcement
	bool is_action = 10;		// /me emote
	int64 lobby_id = 11;		// game lobby chat only
}

// Asks the game to handle a chat line exactly as if it was typed into that channel's chat box, slash commands included.
message ChatSend
{
	ChatChannel channel = 1;
	string text = 2;			// UTF-8
	ChatAudience audience = 3;	// in-match only
}

enum UiScreen
{
	UI_SCREEN_UNKNOWN = 0;
	UI_SCREEN_MAIN_MENU = 1;
	UI_SCREEN_SINGLE_PLAYER = 2;		// campaign, difficulty and map selection
	UI_SCREEN_SKIRMISH_SETUP = 3;
	UI_SCREEN_LAN_LOBBY = 4;
	UI_SCREEN_LAN_GAME_SETUP = 5;
	UI_SCREEN_ONLINE_WELCOME = 6;
	UI_SCREEN_ONLINE_LOBBY = 7;			// chat room and game list
	UI_SCREEN_ONLINE_GAME_SETUP = 8;
	UI_SCREEN_ONLINE_QUICKMATCH = 9;
	UI_SCREEN_REPLAY_MENU = 10;
	UI_SCREEN_OPTIONS = 11;
	UI_SCREEN_SAVE_LOAD = 12;
	UI_SCREEN_CREDITS = 13;
	UI_SCREEN_SCORE_SCREEN = 14;
	UI_SCREEN_CONNECTING = 15;			// establishing connections before a match
	UI_SCREEN_LOADING = 16;				// map or save loading
	UI_SCREEN_IN_GAME = 17;
	UI_SCREEN_IN_GAME_MENU = 18;		// quit menu open
}

// The screen the game is on, sent on every change and to each new reader on connect.
message UiState
{
	UiScreen screen = 1;
	string layout = 2;			// raw top shell layout file name, empty when none
	MatchMode game_mode = 3;	// meaningful for the in-game screens
	bool paused = 4;			// in-game screens only
}

enum LobbySlotState
{
	LOBBY_SLOT_OPEN = 0;
	LOBBY_SLOT_CLOSED = 1;
	LOBBY_SLOT_AI_EASY = 2;
	LOBBY_SLOT_AI_MEDIUM = 3;
	LOBBY_SLOT_AI_BRUTAL = 4;
	LOBBY_SLOT_HUMAN = 5;
}

// One slot of the game setup lobby. player reuses MatchPlayer: lobby_slot, name, side, color, team, is_human,
// is_observer, the random flags and online; player_index is -1 and result unknown before the match.
message LobbySlot
{
	LobbySlotState state = 1;
	MatchPlayer player = 2;		// unset for open and closed slots
	bool is_host = 3;
	bool is_ready = 4;			// the slot accepted the current options
	bool has_map = 5;
	int32 start_position = 6;	// -1 when none
	// Predicted by running the engine's own resolution on a copy with the lobby seed; valid only if prediction_valid.
	// Each is the resolved value; for a slot that is not random it equals the chosen one.
	string predicted_side = 7;
	uint32 predicted_color = 8;	// packed 0xAARRGGBB, 0 when none
	int32 predicted_start_position = 9;
}

enum LobbyKind
{
	LOBBY_KIND_UNKNOWN = 0;
	LOBBY_KIND_ONLINE = 1;
	LOBBY_KIND_LAN = 2;
	LOBBY_KIND_SKIRMISH = 3;
}

// The game setup lobby the user sits in, before the match starts: online, LAN or skirmish setup.
message LobbyState
{
	bool in_lobby = 1;			// false: the user left the lobby, nothing else is set
	LobbyKind kind = 2;
	string map_name = 3;
	OnlineMatch online = 4;		// online lobbies only: lobby id, name and rules; match_id is whatever the lobby holds before the match
	int64 host_user_id = 5;		// online lobbies only
	repeated LobbySlot slots = 6;
	repeated OnlineConnection connections = 7;	// online lobbies only: the local client's own peer connections
	// The predicted_* fields are the engine's own random resolution run on the lobby's current seed and slots, on a
	// private generator state. They are as of this lobby state: a changed seed, slot or map changes them.
	bool prediction_valid = 8;	// sides and colors are predicted
	bool prediction_start_positions_valid = 9;	// start positions (and the observer camera) are predicted; false when the map is not in the map cache
	ObserverCamera predicted_observer_camera = 10;	// set only when the local slot is an observer and the start positions are predicted
	string map_display_name = 11;	// online lobbies only: the lobby's map display name; map_name is the normalised path, as in MatchInfo
}
