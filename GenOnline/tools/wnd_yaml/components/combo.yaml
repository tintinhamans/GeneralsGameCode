# A kit combo box (drop-down list); `image` and the `item_*` params are its own draw slots 0-4.
params:
  font: "Arial"
  font_size: 10
  bold: 0
  header: "GOComboBoxEntry"
  image: "NoImage"
  item_left: "NoImage"
  item_color: "47 75 255 255"
  item_right: "NoImage"
  item_center: "NoImage"
  item_small_center: "NoImage"
status: [ENABLED, IMAGE]
place: {left: control_inset, right: control_inset, h: control_h}
template: |
  WINDOWTYPE = COMBOBOX;
  SCREENRECT = UPPERLEFT: {x0} {y0},
               BOTTOMRIGHT: {x1} {y1},
               CREATIONRESOLUTION: 800 600;
  NAME = "{name}";
  STATUS = {status};
  STYLE = MOUSETRACK+COMBOBOX;
  SYSTEMCALLBACK = "{system}";
  INPUTCALLBACK = "{input}";
  TOOLTIPCALLBACK = "{tooltip_callback}";
  DRAWCALLBACK = "{draw}";
  FONT = NAME: "{font}", SIZE: {font_size}, BOLD: {bold};
  HEADERTEMPLATE = "{header}";
  TOOLTIPTEXT = "{tooltip}";
  TOOLTIPDELAY = -1;
  TEXT = "{text}";
  TEXTCOLOR = ENABLED:  254 254 254 255, ENABLEDBORDER:  0 0 0 255,
              DISABLED: 192 192 192 255, DISABLEDBORDER: 64 64 64 255,
              HILITE:   128 128 255 255, HILITEBORDER:   0 0 128 255;
  ENABLEDDRAWDATA = IMAGE: {image}, COLOR: 255 0 0 255, BORDERCOLOR: 255 128 128 255,
                    IMAGE: {item_left}, COLOR: {item_color}, BORDERCOLOR: 254 254 254 255,
                    IMAGE: {item_right}, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: {item_center}, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: {item_small_center}, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
