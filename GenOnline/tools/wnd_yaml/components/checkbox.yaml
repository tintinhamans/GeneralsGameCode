# A kit check box; the label text sits right of the box.
params:
  font: "Arial"
  font_size: 10
  bold: 0
  header: "GOLabelRegular"
  hilite_text_color: "186 255 12 255"
status: [ENABLED, IMAGE, BORDER]
place: {left: control_inset, right: control_inset, h: control_h}
template: |
  WINDOWTYPE = CHECKBOX;
  SCREENRECT = UPPERLEFT: {x0} {y0},
               BOTTOMRIGHT: {x1} {y1},
               CREATIONRESOLUTION: 800 600;
  NAME = "{name}";
  STATUS = {status};
  STYLE = CHECKBOX+MOUSETRACK;
  SYSTEMCALLBACK = "{system}";
  INPUTCALLBACK = "{input}";
  TOOLTIPCALLBACK = "{tooltip_callback}";
  DRAWCALLBACK = "{draw}";
  FONT = NAME: "{font}", SIZE: {font_size}, BOLD: {bold};
  HEADERTEMPLATE = "{header}";
  TOOLTIPTEXT = "{tooltip}";
  TOOLTIPDELAY = -1;
  TEXT = "{text}";
  TEXTCOLOR = ENABLED:  255 255 255 255, ENABLEDBORDER:  0 0 0 255,
              DISABLED: 192 192 192 255, DISABLEDBORDER: 64 64 64 255,
              HILITE:   {hilite_text_color}, HILITEBORDER:   0 0 0 255;
  ENABLEDDRAWDATA = IMAGE: NoImage, COLOR: 255 0 0 255, BORDERCOLOR: 255 128 128 255,
                    IMAGE: Active-Unchecked, COLOR: 255 255 255 0, BORDERCOLOR: 106 123 255 255,
                    IMAGE: Active-Checked, COLOR: 0 0 255 255, BORDERCOLOR: 106 123 255 255,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                    IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0;
  DISABLEDDRAWDATA = IMAGE: NoImage, COLOR: 128 128 128 255, BORDERCOLOR: 192 192 192 255,
                     IMAGE: Disabled-Unchecked, COLOR: 255 255 255 0, BORDERCOLOR: 192 192 192 255,
                     IMAGE: Disabled-Checked, COLOR: 64 64 64 255, BORDERCOLOR: 254 254 254 255,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                     IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0;
  HILITEDRAWDATA = IMAGE: NoImage, COLOR: 0 255 0 255, BORDERCOLOR: 128 255 128 255,
                   IMAGE: Active-HiLighted, COLOR: 255 255 255 0, BORDERCOLOR: 106 123 255 255,
                   IMAGE: Active-HiLighted-Checked, COLOR: 255 255 0 255, BORDERCOLOR: 254 254 254 255,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0,
                   IMAGE: NoImage, COLOR: 255 255 255 0, BORDERCOLOR: 255 255 255 0;
