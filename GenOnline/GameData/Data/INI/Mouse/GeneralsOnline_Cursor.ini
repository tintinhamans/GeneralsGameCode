; Generals Online: the pointing hand the shell menus show over clickable controls.
; Generated by scripts/go_cursor.py; edit the script, not this file.
; Data/INI/Mouse.ini loads first, so a mod's Mouse.ini keeps every retail cursor; without this entry Hand
; shows the Normal cursor.

MouseCursor Hand
  Texture             = GeneralsOnline_CursorHand
  Image               = GeneralsOnline_CursorHand
  HotSpot             = X:13 Y:13
End
