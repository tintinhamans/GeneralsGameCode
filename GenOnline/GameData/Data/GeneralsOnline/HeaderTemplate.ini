;// GO copies of the retail header templates, under a GO prefix so the GO menu layouts keep these sizes when a mod replaces
;// Data\<language>\HeaderTemplate.ini. scripts/go_wnd_layouts.py points the menu layouts at these names; in-game layouts keep the retail ones.

HeaderTemplate GOTitle
  Font = "Generals"
  Point = 20
  Bold = No
End

HeaderTemplate GOMainButton
  Font = "Generals"
  Point = 15
  Bold = No
End

HeaderTemplate GOButton
  Font = "Arial"
  Point = 12
  Bold = No
End

HeaderTemplate GOButtonSmall
  Font = "Arial"
  Point = 10
  Bold = No
End

HeaderTemplate GOTextEntry
  Font = "Arial"
  Point = 10
  Bold = No
End

HeaderTemplate GOComboBoxEntry
  Font = "Arial"
  Point = 10
  Bold = No
End

;// TheSuperHackers @tweak arcticdolphin 09/11/2026 GO-only: the compact player rows of the game setup screens.
HeaderTemplate GOComboBoxEntrySmall
  Font = "Arial"
  Point = 8
  Bold = No
End

HeaderTemplate GOMinorTitle
  Font = "Arial" ; Generals
  Point = 14
  Bold = No
End

HeaderTemplate GOLabelRegular
  Font = "Arial"
  Point = 10
  Bold = No
End

HeaderTemplate GOLabelSmall
  Font = "Arial"
  Point = 8
  Bold = No
End

HeaderTemplate GOLoadScreenCameos
  Font = "Arial"
  Point = 10
  Bold = No
End

HeaderTemplate GOLoadScreenMissionLocation
  Font = "Arial"
  Point = 14
  Bold = No
End

HeaderTemplate GOArial10BoldTemplate
  Font = "Arial"
  Point = 10
  Bold = Yes
End

HeaderTemplate GOArial12BoldTemplate
  Font = "Arial"
  Point = 12
  Bold = Yes
End

HeaderTemplate GOArial14Template
  Font = "Arial"
  Point = 14
  Bold = No
End

HeaderTemplate GOArial14BoldTemplate
  Font = "Arial"
  Point = 14
  Bold = Yes
End
