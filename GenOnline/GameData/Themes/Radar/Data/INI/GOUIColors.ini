; Generals Online, Radar palette: the colours of the GO interface text, tooltips and lobby rows, by role.
; Mounted over Data/INI/GOUIColors.ini with the Radar palette; the values are the tokens of scripts/go_themes.py PALETTE.
; ChatDefault, PlayerNormal, LobbyRow and Buddy replace those OnlineChatColors of multiplayer.ini.

GOUIColors
  Text              = R:242 G:237 B:224 A:255   ; text
