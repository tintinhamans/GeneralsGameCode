; Generals Online, Generals theme: the same roles as the core table with the orange of the Generals interface.
; The Retail style leaves this file out, so every site keeps the colour it had before this table.
; A role left out keeps that colour too.
; This file merges near-identical GO colours into one value per role and puts the kit line on the tooltip and spinner.
; ChatDefault, PlayerNormal, LobbyRow and Buddy are left to OnlineChatColors in multiplayer.ini here.

GOUIColors
  Text              = R:255 G:255 B:255 A:255   ; chat and system lines, map names, terms of service
  Muted             = R:192 G:192 B:192 A:255   ; information lines, map details
  Disabled          = R:127 G:127 B:127 A:255   ; name change lines
  Help              = R:127 G:127 B:127 A:255   ; /help lines
  Hilite            = R:255 G:255 B:0 A:255     ; /net lines
  Line              = R:232 G:147 B:26 A:255     ; kit line that retail blue layout borders take
  Notice            = R:255 G:194 B:15 A:255    ; warnings and status lines
  Error             = R:255 G:94 B:94 A:255     ; errors, full lobbies, ignored players
  Success           = R:0 G:255 B:0 A:255       ; confirmations
  Admin             = R:0 G:162 B:232 A:255     ; admin chat
  Offline           = R:100 G:130 B:150 A:255   ; offline friends
  TooltipFill       = R:20 G:20 B:20 A:255
  TooltipBorder     = R:232 G:147 B:26 A:255
  TooltipText       = R:220 G:220 B:220 A:255
  TooltipSweep      = R:255 G:255 B:0 A:255
  FieldFill         = R:15 G:10 B:5 A:255        ; open combo box drop-down backing
  LobbyJoinable     = R:255 G:190 B:90 A:255    ; lobby rows that hold a friend
  LobbyNotJoinable  = R:173 G:136 B:58 A:255    ; those rows when the lobby cannot be joined
  LobbyAltRow       = R:191 G:198 B:201 A:255   ; every other lobby row
  LobbyAlmostFull   = R:16 G:173 B:144 A:255    ; player count of a lobby that is nearly full
  ConnectionSpinner = R:232 G:147 B:26 A:255
  LineHilite        = R:255 G:181 B:74 A:255     ; kit line of a hovered or selected frame
  Mention           = R:255 G:136 B:0 A:255     ; chat lines that mention you
End
