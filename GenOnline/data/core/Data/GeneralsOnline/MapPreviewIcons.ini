; FILE: MapPreviewIcons.ini ////////////////////////////////////////////////////////
; Generals Online map preview icons (TheSuperHackers issue 1684).
;
; The map preview marks every object with KindOf TECH_BUILDING or SUPPLY_SOURCE_ON_PREVIEW.
; This table gives each such object an icon category.
;
; MapPreviewIconCategory <Name>
;   Image = <MappedImage name>          drawn at 15 x 15 on the preview; a missing image draws the retail TecBuilding or Cash
;   Label = <text>                      legend and tooltip text when LabelTag is missing
;   LabelTag = <CSF label>              optional localized label; text after " -- " is cut off, e.g. OBJECT:TechOilDerrick
;   TooltipFromTemplate = Yes|No        Yes (default): the tooltip shows the object's DisplayName; No: the label
; End
;
; MapPreviewIconRule
;   Category = <Name>
;   KindOf = <KINDOF ...>               every listed KindOf must be set on the object
;   Template = <name ...>               exact template names, case insensitive
;   TemplatePattern = <pattern ...>     template name wildcards with * and ?, case insensitive
; End
;
; A rule matches when all its KindOf are set and, if it lists templates or patterns, one of them matches.
; Rules are checked in load order and the last matching rule wins, so specific rules go after general ones.
; Categories are listed in the legend in the order they are first defined.
;
; Mods add their own Data\GeneralsOnline\MapPreviewIcons*.ini files (for example MapPreviewIcons_MyMod.ini).
; The files load in name order after this one, so their rules win and a repeated category name overrides its fields.
; /////////////////////////////////////////////////////////////////////////////////

MapPreviewIconCategory SupplyDock
  Image = GOMapIconSupplyDock
  Label = Supply dock
  LabelTag = OBJECT:SupplyDock
End

MapPreviewIconCategory SupplyCrates
  Image = GOMapIconSupplyPile
  Label = Supply crates
  LabelTag = OBJECT:SupplyPile
End

MapPreviewIconCategory RepairBay
  Image = GOMapIconRepairBay
  Label = Repair bay
  LabelTag = OBJECT:TechRepairBay
End

MapPreviewIconCategory Artillery
  Image = GOMapIconArtillery
  Label = Artillery platform
  LabelTag = OBJECT:TechArtilleryPlatform
End

MapPreviewIconCategory OilDerrick
  Image = GOMapIconOilDerrick
  Label = Oil derrick
  LabelTag = OBJECT:TechOilDerrick
End

MapPreviewIconCategory OilRefinery
  Image = GOMapIconOilRefinery
  Label = Oil refinery
  LabelTag = OBJECT:TechOilRefinery
End

MapPreviewIconCategory Hospital
  Image = GOMapIconHospital
  Label = Hospital
  LabelTag = OBJECT:TechHospital
End

MapPreviewIconCategory ReinforcementPad
  Image = GOMapIconReinforcementPad
  Label = Reinforcement pad
  LabelTag = OBJECT:TechReinforcementPad
End

MapPreviewIconCategory Tech
  Image = GOMapIconTech
  Label = Tech building
  LabelTag = TOOLTIP:TechBuilding
End

; general rules first: every preview supply source is a dock and every tech building is generic

MapPreviewIconRule
  Category = SupplyDock
  KindOf = SUPPLY_SOURCE_ON_PREVIEW
End

MapPreviewIconRule
  Category = Tech
  KindOf = TECH_BUILDING
End

; retail Zero Hour templates: SupplyDock, SupplyWarehouse and ToxinRepository keep the dock rule above

MapPreviewIconRule
  Category = SupplyCrates
  KindOf = SUPPLY_SOURCE_ON_PREVIEW
  Template = SupplyPile SupplyPileSmall
  TemplatePattern = *SupplyPile*
End

MapPreviewIconRule
  Category = RepairBay
  KindOf = TECH_BUILDING
  Template = TechRepairbay TechRepairPad
  TemplatePattern = *Repair*
End

MapPreviewIconRule
  Category = Artillery
  KindOf = TECH_BUILDING
  Template = TechArtilleryPlatform
  TemplatePattern = *Artillery*
End

MapPreviewIconRule
  Category = OilDerrick
  KindOf = TECH_BUILDING
  Template = TechOilDerrick
  TemplatePattern = *OilDerrick*
End

MapPreviewIconRule
  Category = OilRefinery
  KindOf = TECH_BUILDING
  Template = TechOilRefinery
  TemplatePattern = *OilRefinery*
End

MapPreviewIconRule
  Category = Hospital
  KindOf = TECH_BUILDING
  Template = TechHospital
  TemplatePattern = *Hospital*
End

MapPreviewIconRule
  Category = ReinforcementPad
  KindOf = TECH_BUILDING
  Template = TechReinforcementPad
  TemplatePattern = *ReinforcementPad*
End
