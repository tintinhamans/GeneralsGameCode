// The client: command line (watch, dump, replay, chat, schema, example) and a Swing GUI, written against the
// library's public API only. FlatLaf (a Swing look and feel) is the only dependency besides the library.
//
//   ./gradlew :app:run --args="watch"
//   ./gradlew :app:installDist           script in app/build/install/stats-exporter-client/bin
plugins {
    id 'application'
}

dependencies {
    implementation project(':lib')
    implementation "com.formdev:flatlaf:${flatlafVersion}"
}

application {
    mainClass = 'com.generalsonline.stats.app.Main'
    applicationName = 'stats-exporter-client'
}
