// Settings shared by the three projects. What each project builds is in its own build.gradle.
allprojects {
    group = 'com.generalsonline'
    version = '2.1.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
