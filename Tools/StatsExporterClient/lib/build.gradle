// com.generalsonline:stats-pipe-client - the library other programs depend on.
//
//   ./gradlew :lib:build                  compile, generate the protobuf classes, run the tests, build the jars
//   ./gradlew :lib:publishToMavenLocal    install the jar, the sources jar and the javadoc jar into ~/.m2
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.google.protobuf' version '0.9.5'
}

description = 'Java client for the live stats pipe of Generals Online: frames, a match state, dump files and chat.'

base {
    archivesName = 'stats-pipe-client'
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // The generated message classes are part of the API (every callback receives one), so protobuf-java is api scope.
    api "com.google.protobuf:protobuf-java:${protobufVersion}"

    testImplementation platform(junitBom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Automatic-Module-Name': 'com.generalsonline.stats',
            'Implementation-Title': 'stats-pipe-client',
            'Implementation-Version': project.version)
    }
}

// The engine's proto is the only copy. It declares optimize_for = LITE_RUNTIME, which would make the Java classes lite
// (no descriptors, no TextFormat). The wire format is identical, so the build generates from a filtered copy with that
// option dropped and Java options added; the engine's file is never modified.
def engineProto = file('../../../GeneralsMD/Code/GameEngine/Source/Common/StatsExporter.proto')

tasks.register('prepareProto', Copy) {
    from engineProto
    into layout.buildDirectory.dir('filtered-proto')
    filter { String line ->
        if (line.contains('optimize_for')) {
            return '// (optimize_for removed for the Java build)'
        }
        if (line.startsWith('package statsexporter;')) {
            return line + '\noption java_multiple_files = true;\noption java_package = "com.generalsonline.stats.proto";'
        }
        return line
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
}

// The task itself is the source dir, so every consumer (generateProto, processResources) depends on it.
sourceSets {
    main {
        proto {
            srcDir tasks.named('prepareProto')
        }
    }
}

// The API documentation covers the public packages. The generated message classes document themselves through the
// protocol reference (docs/stats-exporter.md), and the internal package is not meant for users.
tasks.named('javadoc') {
    exclude 'com/generalsonline/stats/proto/**', 'com/generalsonline/stats/internal/**'
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:all', true)
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'stats-pipe-client'
            from components.java
            pom {
                name = 'Generals Online stats pipe client'
                description = project.description
                licenses {
                    license {
                        name = 'GNU General Public License, version 3, with additional terms'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    }
                }
            }
        }
    }
}
